<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsi-Lord</title>
  <meta name="description" content="Obsi-Lord, a local voice assistant with an animated face: hold Space to talk or type a message.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="hud-header">
      <h1 class="brand-title">Obsi-Lord</h1>
      <div class="status-badges">
        <span id="link-badge" class="readout">Link: <span id="status">connecting</span></span>
        <span id="state-badge" class="readout">idle</span>
      </div>
    </header>
    <div class="viewport-frame">
      <div class="viewport-screen">
        <canvas id="face" width="64" height="48" aria-label="Obsi-Lord face"></canvas>
        <div class="scan-line" aria-hidden="true"></div>
      </div>
      <span id="feed-label" class="viewport-label" aria-hidden="true">Face</span>
    </div>
    <section id="subtitles" aria-live="polite">
      <p id="user-line"></p>
      <p id="subtitle"></p>
    </section>
    <form id="chat" autocomplete="off">
      <div class="input-wrapper">
        <input id="chat-input" type="text" maxlength="2000" placeholder="Type a message" aria-label="Message">
      </div>
      <button id="chat-send" type="submit">Send</button>
      <button id="chat-talk" type="button">Hold to talk</button>
    </form>
    <p id="ptt-hint" data-mode="off"><span id="ptt-dot" aria-hidden="true"></span><span id="ptt-text"></span></p>
    <p id="error-line" role="alert"></p>
    <section id="debug" hidden>
      <div id="debug-states"></div>
      <label>mouth
        <input id="debug-mouth" type="range" min="0" max="3" step="1" value="0">
        <span id="debug-mouth-value">0</span>
      </label>
      <button id="debug-mouth-auto" type="button">mouth auto</button>
      <div id="debug-eq">
        <label>bass
          <input id="debug-bass" type="range" min="-24" max="24" step="0.5" value="-6">
          <span id="debug-bass-value"></span>
        </label>
        <label>treble
          <input id="debug-treble" type="range" min="-24" max="24" step="0.5" value="0">
          <span id="debug-treble-value"></span>
        </label>
        <p id="debug-eq-config"></p>
      </div>
    </section>
  </main>
  <script type="module">
    import { start, getState, onStateChange, skinReady } from "/static/face.js";
    import { initDebug } from "/static/debug.js";
    import "/static/ws.js";

    // HUD readouts. The face state goes on body[data-status] (style.css lights
    // the bed's ring from it) and into the state readout. The link readout text
    // is whatever ws.js writes into #status; it is mirrored to body[data-link]
    // for the readout color.
    const stateBadge = document.getElementById("state-badge");
    const linkStatus = document.getElementById("status");
    function showState(name) {
      document.body.dataset.status = name;
      stateBadge.textContent = name;
    }
    function showLink() {
      document.body.dataset.link = linkStatus.textContent.trim();
    }
    onStateChange((name) => showState(name));
    new MutationObserver(showLink).observe(linkStatus, { childList: true, characterData: true, subtree: true });
    showState(getState());
    showLink();
    // The caption under the face names the skin once face.js has loaded it.
    skinReady.then((skin) => {
      document.getElementById("feed-label").textContent = skin === "dither" ? "3D face" : "8-bit face";
    });

    start(document.getElementById("face"));
    initDebug(document.getElementById("debug"));
  </script>
</body>
</html>

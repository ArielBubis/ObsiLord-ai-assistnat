<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Obsi-Lord</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header class="hud-header">
      <h1 class="brand-title"><span aria-hidden="true">// </span>Obsi-Lord</h1>
      <div class="status-badges">
        <span id="link-badge" class="brutal-badge">Link: <span id="status">connecting</span></span>
        <span id="state-badge" class="brutal-badge">idle</span>
      </div>
    </header>
    <div class="viewport-frame">
      <span id="feed-label" class="viewport-label" aria-hidden="true">SYS.FEED</span>
      <div class="viewport-screen">
        <canvas id="face" width="64" height="48" aria-label="Obsi-Lord face"></canvas>
        <div class="scan-line" aria-hidden="true"></div>
      </div>
    </div>
    <section id="subtitles" aria-live="polite">
      <p id="user-line"></p>
      <p id="subtitle" tabindex="0" role="region" aria-label="Reply"></p>
    </section>
    <form id="chat" autocomplete="off">
      <div class="input-wrapper">
        <span class="input-prefix" aria-hidden="true">&gt;</span>
        <input id="chat-input" type="text" maxlength="2000" placeholder="Type a message" aria-label="Message">
      </div>
      <button id="chat-send" type="submit">Send</button>
      <button id="chat-talk" type="button">Hold to talk</button>
    </form>
    <p id="ptt-hint" data-mode="off"><span id="ptt-dot" aria-hidden="true"></span><span id="ptt-text"></span></p>
    <p id="error-line" role="alert"></p>
    <section id="llm-notice" role="status" hidden>
      <div class="notice-head">
        <p id="llm-notice-title"></p>
        <button id="llm-notice-close" type="button" aria-label="Close the notice">Close</button>
      </div>
      <ul id="llm-notice-lines"></ul>
    </section>
    <details id="settings">
      <summary>Settings</summary>
      <fieldset class="settings-group">
        <legend>Chat model</legend>
        <label class="settings-choice">
          <input id="llm-gemini" type="radio" name="llm-provider" value="gemini">
          <span>Gemini <span id="llm-gemini-note" class="settings-dim"></span></span>
        </label>
        <label class="settings-choice">
          <input id="llm-local" type="radio" name="llm-provider" value="local">
          <span>Local</span>
        </label>
        <div class="settings-row">
          <select id="llm-model" aria-label="Local model"></select>
          <button id="llm-refresh" type="button">Refresh</button>
        </div>
        <p id="llm-server" class="settings-dim"></p>
        <p id="llm-status" class="settings-dim" aria-live="polite"></p>
      </fieldset>
      <fieldset class="settings-group">
        <legend>Photos</legend>
        <label class="settings-choice">
          <input type="radio" name="photos-mode" value="off">
          <span>Don't keep <span class="settings-dim">(used for that reply only)</span></span>
        </label>
        <label class="settings-choice">
          <input type="radio" name="photos-mode" value="followup">
          <span>Keep for follow-ups <span class="settings-dim">(in memory, newest only)</span></span>
        </label>
        <label class="settings-choice">
          <input type="radio" name="photos-mode" value="disk">
          <span>Save to disk <span class="settings-dim">(data/photos on this PC)</span></span>
        </label>
        <p class="settings-dim">Follow-ups see a photo again only with a local model that sees photos. Other models get Qwenny's description, as before.</p>
      </fieldset>
      <fieldset id="conv-group" class="settings-group" hidden>
        <legend>Conversations</legend>
        <div class="settings-row">
          <button id="conv-new" type="button">New conversation</button>
        </div>
        <p id="conv-note" class="settings-dim" aria-live="polite"></p>
        <ul id="conv-list"></ul>
      </fieldset>
    </details>
    <section id="snapshots">
      <label class="snap-switch">
        <input id="snap-toggle" type="checkbox">
        <span>Snapshots</span>
      </label>
      <div id="snap-panel" hidden>
        <figure>
          <figcaption>Camera</figcaption>
          <div class="snap-frame"><img id="snap-camera" alt="The frame the camera took" hidden></div>
        </figure>
        <figure>
          <figcaption>Sent to search</figcaption>
          <div class="snap-frame"><img id="snap-search" alt="The crop sent to the image search" hidden></div>
          <p id="snap-note"></p>
        </figure>
      </div>
    </section>
    <section id="debug" hidden>
      <div id="debug-states"></div>
      <label>mouth
        <input id="debug-mouth" type="range" min="0" max="3" step="1" value="0">
        <span id="debug-mouth-value">0</span>
      </label>
      <button id="debug-mouth-auto" type="button">mouth auto</button>
      <div id="debug-eq">
        <label>bass
          <input id="debug-bass" type="range" min="-24" max="24" step="0.5" value="-6">
          <span id="debug-bass-value"></span>
        </label>
        <label>treble
          <input id="debug-treble" type="range" min="-24" max="24" step="0.5" value="0">
          <span id="debug-treble-value"></span>
        </label>
        <p id="debug-eq-config"></p>
      </div>
      <div id="debug-memory">
        <p class="memory-head">Memory tests</p>
        <p id="debug-memory-note"></p>
        <div id="debug-memory-list"></div>
      </div>
    </section>
  </main>
  <script type="module">
    import { start, getState, onStateChange, skinReady } from "/static/face.js";
    import { initDebug } from "/static/debug.js";
    import "/static/ws.js";

    // HUD readouts. The face state goes on body[data-status] (style.css runs
    // the scan line from it) and into the state badge. The link badge text is
    // whatever ws.js writes into #status; it is mirrored to body[data-link]
    // for the badge color.
    const stateBadge = document.getElementById("state-badge");
    const linkStatus = document.getElementById("status");
    function showState(name) {
      document.body.dataset.status = name;
      stateBadge.textContent = name;
    }
    function showLink() {
      document.body.dataset.link = linkStatus.textContent.trim();
    }
    onStateChange((name) => showState(name));
    new MutationObserver(showLink).observe(linkStatus, { childList: true, characterData: true, subtree: true });
    showState(getState());
    showLink();
    // The feed tag names the skin once face.js has loaded it.
    skinReady.then((skin) => {
      document.getElementById("feed-label").textContent = `SYS.FEED // ${skin === "dither" ? "3D" : "64x48"}`;
    });

    start(document.getElementById("face"));
    initDebug(document.getElementById("debug"));
  </script>
</body>
</html>

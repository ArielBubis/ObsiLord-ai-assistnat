# Copy to config.toml. Non-secret settings only. Secrets go in .env.

[server]
host = "127.0.0.1"   # do not change
port = 8765

[llm]
provider = "gemini"
# Looked up 2026-10-06 on ai.google.dev: gemini-3.5-flash-lite (stable, text and
# image input, function calling, thinking supported). Paid tier: $0.30 per 1M
# input tokens, $2.50 per 1M output tokens. Unverified: thinking tokens billed at
# the output rate (usual for Gemini pricing, not re-checked for this model).
# Free tier: prompts and replies may be used to improve Google products.
# SDK: google-genai 2.28.0 (pinned in requirements.in).
model = "gemini-3.5-flash-lite"
max_output_tokens = 200
# Gemini 3.x thinking level: "minimal", "low", "medium", "high", or "" for the
# model default. Lower is faster and cheaper. Thinking tokens count toward the cap.
thinking_level = "minimal"
history_turns = 10
daily_token_cap = 200000   # placeholder, tune after Phase 2
turn_timeout_s = 60       # server-side limit for one whole reply

[stt]
provider = "faster-whisper"
model = "small"
device = "cpu"
compute_type = "int8"
language = "en"

[tts]
provider = "piper"
voice = ""            # path or name of the Piper voice, set at setup

[camera]
device_index = 0
max_edge_px = 768
warmup_frames = 5
cooldown_s = 10
max_per_hour = 30

[face]
logical_width = 64
logical_height = 48
mouth_thresholds = [0.05, 0.15, 0.30]   # RMS cutoffs for mouth frames 1, 2, 3

[audio]
push_to_talk_key = "Space"

# Copy to config.toml. Non-secret settings only. Secrets go in .env.

[server]
host = "127.0.0.1"   # do not change
port = 8765

[llm]
provider = "gemini"
# Looked up 2026-10-06 on ai.google.dev: gemini-3.5-flash-lite (stable, text and
# image input, function calling, thinking supported). Paid tier: $0.30 per 1M
# input tokens, $2.50 per 1M output tokens. Unverified: thinking tokens billed at
# the output rate (usual for Gemini pricing, not re-checked for this model).
# Free tier: prompts and replies may be used to improve Google products.
# SDK: google-genai 2.28.0 (pinned in requirements.in).
model = "gemini-3.5-flash-lite"
max_output_tokens = 200
# Gemini 3.x thinking level: "minimal", "low", "medium", "high", or "" for the
# model default. Lower is faster and cheaper. Thinking tokens count toward the cap.
thinking_level = "minimal"
history_turns = 10
daily_token_cap = 200000   # placeholder, tune after Phase 2
turn_timeout_s = 60       # server-side limit for one whole reply

[stt]
# faster-whisper 1.2.1 (PyPI, MIT, SYSTRAN/faster-whisper), runs locally, no API
# cost. Checked in the installed package 2026-10-12.
provider = "faster-whisper"
# Model size or a path to a converted model directory. "small" is
# Systran/faster-whisper-small on Hugging Face (MIT, about 486 MB, looked up
# 2026-10-12). It is downloaded into download_root on the first start and
# loaded from there afterwards. Empty string disables voice input.
model = "small"
device = "cpu"          # "cpu" or "cuda"
compute_type = "int8"   # int8 on CPU; float16 or int8_float16 on a GPU
language = "en"         # language code; empty lets the model detect it
# Decoding beam width, 1 to 10. 1 (greedy) is fastest; 5 is a little more
# accurate and slower.
beam_size = 1
# Push-to-talk limits. Audio past max_utterance_s (1 to 120) is dropped;
# recordings shorter than min_utterance_ms (50 to 5000) are rejected.
max_utterance_s = 30.0
min_utterance_ms = 300
# Model cache, relative to the repo root (models/ is gitignored).
download_root = "models"

[tts]
# Piper via piper-tts 1.8.0 (PyPI, looked up 2026-10-06). License GPL-3.0-or-later
# (OHF-Voice/piper1-gpl). Runs locally on CPU, no API cost.
provider = "piper"
# Voice model path, relative to the repo root. Empty string disables TTS (text
# only replies). Not in git (voices/ is gitignored). Downloaded 2026-10-06:
# en_GB-semaine-medium.onnx and its .onnx.json from the rhasspy/piper-voices
# repository on Hugging Face (en/en_GB/semaine/medium/).
# 22050 Hz, 4 speakers. Dataset license: CC BY-NC-SA 4.0 (non-commercial use).
voice = "voices/en_GB-semaine-medium.onnx"
# Speaker name from the voice's speaker_id_map (.onnx.json). For semaine:
# prudence, spike, obadiah, poppy. Empty uses the voice's default speaker.
speaker = "obadiah"
# Phoneme length: < 1.0 speaks faster, > 1.0 slower. Must be > 0.
length_scale = 1.0
# Pitch factor: 1.0 is the voice as recorded, 1.06 is about one semitone
# higher, 0.94 about one lower. Allowed 0.8 to 1.25; small steps (0.03 to 0.1)
# sound natural. How it works: the server synthesizes more slowly
# (length_scale * pitch) and tells the browser a higher sample rate (22050 *
# pitch). Playing faster raises the pitch and brings the tempo back to normal.
pitch = 1.0
# Playback EQ, applied in the browser to the speech only (read from
# /config/audio). A shelf boosts (+dB) or cuts (-dB) everything below
# (low shelf) or above (high shelf) its frequency. 0 dB disables a shelf.
# Frequencies 20 to 10000 Hz, gains -24 to +24 dB; 3 to 6 dB is usually enough.
# Low shelf: cuts boom and bass. 150 to 300 Hz is the useful range for a voice.
low_shelf_hz = 250.0
low_shelf_db = -6.0
# High shelf: adds (or tames) brightness and clarity. Try 3000 to 5000 Hz.
high_shelf_hz = 3500.0
high_shelf_db = 0.0

[camera]
# Used by look(). Frames stay in memory: never written to disk or logged.
device_index = 0
max_edge_px = 768      # longest edge sent to the vision model (64 to 4096)
warmup_frames = 5      # frames read and dropped after opening (exposure settles)
cooldown_s = 10        # minimum time between two looks
max_per_hour = 30      # looks per rolling hour (at least 1)
# OpenCV capture backend: "dshow" (DirectShow), "msmf" (Media Foundation) or
# "any". Media Foundation hung on open on the dev machine (Brio 100).
api = "dshow"
timeout_s = 20         # limit for opening the camera and grabbing one frame

[vision]
# Local vision model for look(): the frame is described on this PC and Gemini
# only gets the text. llama.cpp llama-server, prebuilt Windows build b11919
# (github.com/ggml-org/llama.cpp, looked up 2026-10-27), started on 127.0.0.1
# for each look and stopped after. Model: Qwen3-VL-2B-Instruct Q4_K_M with its
# Q8_0 mmproj (Qwen/Qwen3-VL-2B-Instruct-GGUF on Hugging Face, Apache-2.0,
# about 1.5 GB). Download all of it once with:
#   python -m obsilord.vision.fetch
# Paths are relative to the repo root (models/ is gitignored). An empty model
# turns look() off.
backend = "vulkan"     # "vulkan" (GPU) or "cpu"; vulkan falls back to cpu if it fails to start
server_vulkan = "models/llama.cpp/b11919-vulkan/llama-server.exe"
server_cpu = "models/llama.cpp/b11919-cpu/llama-server.exe"
model = "models/vision/qwen3-vl-2b/Qwen3VL-2B-Instruct-Q4_K_M.gguf"
mmproj = "models/vision/qwen3-vl-2b/mmproj-Qwen3VL-2B-Instruct-Q8_0.gguf"
ctx = 2048             # context tokens: image, prompt and answer
max_tokens = 120       # longest answer
cpu_max_edge_px = 512  # on the CPU build the frame is shrunk to this first
start_timeout_s = 30   # until the server is ready
request_timeout_s = 30 # one answer

[face]
logical_width = 64
logical_height = 48
mouth_thresholds = [0.05, 0.15, 0.30]   # RMS cutoffs for mouth frames 1, 2, 3
skin = "dither"   # "dither" (3D face, WebGL) or "code" (8-bit face)
# Character for the dither skin: a .face.glb from the face creator, or a plain
# .glb or .vrm. Path relative to the repo root (or absolute). Empty uses the
# bundled character (web/ai-face/characters/default.face.glb). The file is
# checked at startup: a missing file, one that is not binary glTF 2.0, one that
# uses Draco, meshopt or KTX2 compression, or one that links to external files
# stops startup with an error. A characters/ folder in the repo root is
# gitignored, for your own files. Restart the server after changing this.
character = ""

[audio]
push_to_talk_key = "Space"

[debug]
# Optional section. true prints every Gemini and llama-server request and reply
# to the console: system prompt, conversation, tool calls and results, vision
# prompt and answer, token counts and timings. Camera frames show as their size
# only. Leave false in normal use: it puts your conversation in the log.
log_prompts = false
